<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cat Printer Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; color: #fff; min-height: 100vh;
      display: flex; justify-content: center; padding: 20px;
    }
    .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; padding-top: 20px; }
    .header { text-align: center; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
    .status-bar {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: #141414; border-radius: 12px; border: 1px solid #222;
    }
    .status-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #ff3b30; flex-shrink: 0; transition: background 0.3s;
    }
    .status-dot.connected { background: #34c759; box-shadow: 0 0 8px rgba(52,199,89,0.5); }
    .status-text { font-size: 15px; font-weight: 500; }
    .printer-name { margin-left: auto; font-size: 13px; color: #666; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-disconnect { background: #991b1b; color: #fff; font-size: 14px; padding: 10px; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section-label { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: #888; }
    .input-group input, .input-group textarea {
      width: 100%; padding: 12px 14px; background: #141414; border: 1px solid #333;
      border-radius: 10px; color: #fff; font-size: 15px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus, .input-group textarea:focus { border-color: #2563eb; }
    .input-group textarea { min-height: 60px; resize: vertical; }
    .items-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: flex; gap: 8px; align-items: center;
    }
    .item-row input[type="text"] { flex: 1; }
    .item-row input[type="number"] { width: 60px; flex: none; text-align: center; }
    .item-row input[type="number"] { width: 60px; }
    .item-row input { padding: 10px; background: #141414; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .item-row input:focus { border-color: #2563eb; }
    .item-row input[type="number"] { width: 55px; text-align: center; }
    .item-row input[type="text"] { flex: 1; }
    .item-remove {
      background: none; border: none; color: #666; font-size: 20px;
      cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    .item-remove:hover { color: #f87171; }
    .add-item-btn {
      background: none; border: 1px dashed #444; border-radius: 8px;
      color: #666; padding: 8px; cursor: pointer; font-size: 14px; text-align: center;
    }
    .add-item-btn:hover { border-color: #2563eb; color: #2563eb; }
    .preview-box {
      background: #fff; border-radius: 8px; padding: 12px; overflow-x: auto;
    }
    .preview-box canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
    .log-box {
      background: #111; border: 1px solid #222; border-radius: 8px;
      padding: 10px; max-height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 11px; color: #888; line-height: 1.5;
    }
    .log-entry { white-space: pre-wrap; word-break: break-all; }
    .log-entry.error { color: #f87171; }
    .log-entry.success { color: #4ade80; }
    .log-entry.warn { color: #fbbf24; }
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 14px 24px; border-radius: 10px; font-size: 15px; font-weight: 500;
      z-index: 1000; transition: transform 0.3s ease; max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-info { background: #1e40af; color: #fff; }
    .toast-success { background: #166534; color: #fff; }
    .toast-error { background: #991b1b; color: #fff; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">Cat Printer Test</div>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Не подключён</span>
      <span class="printer-name" id="printerName"></span>
    </div>

    <button class="btn btn-primary" id="btnScan" onclick="startScan()">Найти принтер</button>
    <button class="btn btn-disconnect" id="btnDisconnect" onclick="disconnectPrinter()" style="display:none">Отключиться</button>

    <div class="section-label">Настройка чека</div>

    <div class="input-group">
      <label>Название заведения</label>
      <input type="text" id="shopName" value="ШАУРМА №1" placeholder="Название магазина">
    </div>

    <div class="section-label">Позиции</div>
    <div class="items-list" id="itemsList">
      <div class="item-row">
        <input type="text" value="Шаурма классическая" placeholder="Название">
        <input type="number" value="1" min="1" max="99" placeholder="кол-во">
        <input type="number" value="8.50" min="0" step="0.01" placeholder="цена">
        <button class="item-remove" onclick="removeItem(this)">&times;</button>
      </div>
      <div class="item-row">
        <input type="text" value="Чипсы из лаваша" placeholder="Название">
        <input type="number" value="1" min="1" max="99" placeholder="кол-во">
        <input type="number" value="3.00" min="0" step="0.01" placeholder="цена">
        <button class="item-remove" onclick="removeItem(this)">&times;</button>
      </div>
    </div>
    <button class="add-item-btn" onclick="addItem()">+ Добавить позицию</button>

    <div class="input-group">
      <label>Свой текст (опционально)</label>
      <textarea id="customText" placeholder="Дополнительный текст для чека..."></textarea>
    </div>

    <div class="section-label">Предпросмотр</div>
    <div class="preview-box">
      <canvas id="previewCanvas" width="384" height="300"></canvas>
    </div>

    <button class="btn btn-print" id="btnPrint" onclick="printReceipt()" disabled>Напечатать чек</button>

    <div class="section-label">Лог</div>
    <div class="log-box" id="logBox"></div>
  </div>
  <div class="toast toast-info" id="toast"></div>
  <canvas id="receiptCanvas" style="display:none"></canvas>

  <script>
    var ISSC_SERVICE = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
    var ISSC_TX = '49535343-8841-43f4-a8d4-ecbe34729bb3';
    var ISSC_RX = '49535343-1e4d-4bd9-ba61-23c647249616';
    var PRINTER_WIDTH = 384;
    var BLE_CHUNK_SIZE = 182;
    var BLE_CHUNK_DELAY = 40;

    var device = null;
    var txChar = null;

    var btnScan = document.getElementById('btnScan');
    var btnPrint = document.getElementById('btnPrint');
    var btnDisconnect = document.getElementById('btnDisconnect');
    var statusDot = document.getElementById('statusDot');
    var statusText = document.getElementById('statusText');
    var printerNameEl = document.getElementById('printerName');
    var toastEl = document.getElementById('toast');
    var logBox = document.getElementById('logBox');

    var toastTimeout = null;
    function showToast(msg, type, dur) {
      type = type || 'info'; dur = dur || 3000;
      clearTimeout(toastTimeout);
      toastEl.textContent = msg;
      toastEl.className = 'toast toast-' + type + ' show';
      toastTimeout = setTimeout(function() { toastEl.classList.remove('show'); }, dur);
    }

    function addLog(msg, cls) {
      var ts = new Date().toLocaleTimeString();
      var div = document.createElement('div');
      div.className = 'log-entry' + (cls ? ' ' + cls : '');
      div.textContent = '[' + ts + '] ' + msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
      console.log('[' + ts + '] ' + msg);
    }

    function setStatus(connected, name) {
      statusDot.className = connected ? 'status-dot connected' : 'status-dot';
      statusText.textContent = connected ? 'Подключён' : 'Не подключён';
      printerNameEl.textContent = name || '';
      btnPrint.disabled = !connected;
      btnDisconnect.style.display = connected ? 'block' : 'none';
    }

    function disconnectPrinter() {
      if (device && device.gatt.connected) device.gatt.disconnect();
      device = null; txChar = null;
      setStatus(false);
      addLog('Отключено', 'error');
    }

    function addItem() {
      var list = document.getElementById('itemsList');
      var row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML =
        '<input type="text" value="" placeholder="Название">' +
        '<input type="number" value="1" min="1" max="99">' +
        '<input type="number" value="0.00" min="0" step="0.01">' +
        '<button class="item-remove" onclick="removeItem(this)">&times;</button>';
      list.appendChild(row);
    }

    function removeItem(btn) {
      var list = document.getElementById('itemsList');
      if (list.children.length > 1) {
        btn.parentElement.remove();
        updatePreview();
      }
    }

    function getItems() {
      var rows = document.querySelectorAll('#itemsList .item-row');
      var items = [];
      rows.forEach(function(row) {
        var inputs = row.querySelectorAll('input');
        var name = inputs[0].value.trim();
        var qty = parseInt(inputs[1].value) || 1;
        var price = parseFloat(inputs[2].value) || 0;
        if (name) items.push({ name: name, qty: qty, price: price });
      });
      return items;
    }

    function generateReceiptLines() {
      var shopName = document.getElementById('shopName').value.trim() || 'МАГАЗИН';
      var customText = document.getElementById('customText').value.trim();
      var items = getItems();
      var orderNum = Math.floor(Math.random() * 9000) + 1000;
      var now = new Date();
      var dateStr = now.toLocaleDateString('ru-RU');
      var timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

      var total = 0;
      var lines = [];

      lines.push('================================');
      lines.push('');
      lines.push(centerText(shopName));
      lines.push('');
      lines.push('================================');
      lines.push('');
      lines.push('  ЗАКАЗ #' + orderNum);
      lines.push('  ' + dateStr + '  ' + timeStr);
      lines.push('');
      lines.push('--------------------------------');

      items.forEach(function(item) {
        var itemTotal = item.qty * item.price;
        total += itemTotal;
        var qtyStr = item.qty + ' x ' + item.price.toFixed(2);
        lines.push('');
        lines.push('  ' + item.name);
        lines.push('    ' + qtyStr + '    = ' + itemTotal.toFixed(2));
      });

      lines.push('');
      lines.push('--------------------------------');
      lines.push('');
      lines.push('  ИТОГО:  ' + total.toFixed(2) + ' руб.');
      lines.push('');
      lines.push('================================');

      if (customText) {
        lines.push('');
        customText.split('\n').forEach(function(l) {
          lines.push('  ' + l);
        });
        lines.push('');
        lines.push('================================');
      }

      lines.push('');
      lines.push(centerText('Спасибо за покупку!'));
      lines.push('');
      lines.push('');

      return lines;
    }

    function centerText(text) {
      var w = 32;
      var pad = Math.max(0, Math.floor((w - text.length) / 2));
      var s = '';
      for (var i = 0; i < pad; i++) s += ' ';
      s += text;
      return s;
    }

    function renderReceiptToCanvas(lines, canvas) {
      var ctx = canvas.getContext('2d');
      var fontSize = 20;
      var lineHeight = fontSize + 8;
      var padding = 16;
      var height = lines.length * lineHeight + padding * 2;

      canvas.width = PRINTER_WIDTH;
      canvas.height = height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PRINTER_WIDTH, height);
      ctx.fillStyle = '#000000';
      ctx.font = fontSize + 'px monospace';
      ctx.textBaseline = 'top';

      lines.forEach(function(line, i) {
        ctx.fillText(line, padding, padding + i * lineHeight);
      });

      return { width: PRINTER_WIDTH, height: height };
    }

    function pixelsFromCanvas(canvas) {
      var ctx = canvas.getContext('2d');
      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var pixels = [];
      for (var y = 0; y < canvas.height; y++) {
        var row = [];
        for (var x = 0; x < canvas.width; x++) {
          var idx = (y * canvas.width + x) * 4;
          var gray = imgData.data[idx] * 0.299 + imgData.data[idx+1] * 0.587 + imgData.data[idx+2] * 0.114;
          row.push(gray < 128);
        }
        pixels.push(row);
      }
      return pixels;
    }

    function updatePreview() {
      var lines = generateReceiptLines();
      var canvas = document.getElementById('previewCanvas');
      renderReceiptToCanvas(lines, canvas);
    }

    document.getElementById('shopName').addEventListener('input', updatePreview);
    document.getElementById('customText').addEventListener('input', updatePreview);
    document.getElementById('itemsList').addEventListener('input', updatePreview);

    async function startScan() {
      addLog('Сканирование...', 'success');
      btnScan.disabled = true;
      btnScan.innerHTML = '<span class="spinner"></span> Поиск...';

      try {
        var btDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'YHK' }],
          optionalServices: [ISSC_SERVICE]
        });
        addLog('Найдено: ' + btDevice.name, 'success');
        await connectToDevice(btDevice);
      } catch (err) {
        addLog('Ошибка: ' + err.message, 'error');
        showToast('Ошибка: ' + err.message, 'error');
      } finally {
        btnScan.disabled = false;
        btnScan.innerHTML = 'Найти принтер';
      }
    }

    async function connectToDevice(btDevice) {
      addLog('Подключение к ' + btDevice.name + '...');
      showToast('Подключение...', 'info');

      try {
        var gatt = await btDevice.gatt.connect();
        addLog('GATT OK');

        var service = await gatt.getPrimaryService(ISSC_SERVICE);
        addLog('ISSC сервис найден!', 'success');

        txChar = await service.getCharacteristic(ISSC_TX);
        addLog('TX: ' + txChar.uuid, 'success');

        try {
          var rxChar = await service.getCharacteristic(ISSC_RX);
          await rxChar.startNotifications();
          rxChar.addEventListener('characteristicvaluechanged', function(e) {
            var val = new Uint8Array(e.target.value.buffer);
            addLog('RX: ' + Array.from(val).map(function(b) { return b.toString(16).padStart(2,'0'); }).join(' '));
          });
          addLog('Notify OK', 'success');
        } catch(e) {
          addLog('Notify недоступен', 'warn');
        }

        btDevice.addEventListener('gattserverdisconnected', function() {
          addLog('Отключено', 'error');
          device = null; txChar = null; setStatus(false);
        });

        device = btDevice;
        setStatus(true, btDevice.name);
        showToast('Подключён!', 'success');
        addLog('=== ГОТОВО ===', 'success');
        updatePreview();
      } catch (err) {
        addLog('Ошибка: ' + err.message, 'error');
        showToast('Ошибка: ' + err.message, 'error');
        setStatus(false);
      }
    }

    async function sendRaw(data) {
      if (!txChar) throw new Error('Не подключён');
      var offset = 0;
      while (offset < data.length) {
        var end = Math.min(offset + BLE_CHUNK_SIZE, data.length);
        var chunk = data.slice(offset, end);
        await txChar.writeValueWithoutResponse(chunk);
        offset = end;
        if (offset < data.length) await sleep(BLE_CHUNK_DELAY);
      }
    }

    async function printReceipt() {
      if (!device || !device.gatt.connected) {
        showToast('Не подключён', 'error');
        return;
      }
      addLog('=== ПЕЧАТЬ ===', 'success');
      btnPrint.disabled = true;
      showToast('⏳ Печатается...', 'info', 5000);

      try {
        var lines = generateReceiptLines();
        var receiptCanvas = document.getElementById('receiptCanvas');
        renderReceiptToCanvas(lines, receiptCanvas);

        addLog('Размер чека: ' + receiptCanvas.width + 'x' + receiptCanvas.height + ' px');

        var pixels = pixelsFromCanvas(receiptCanvas);
        var height = pixels.length;
        var width = pixels[0].length;
        var widthBytes = Math.ceil(width / 8);
        var bitmap = new Uint8Array(widthBytes * height);

        for (var y = 0; y < height; y++) {
          for (var x = 0; x < width; x++) {
            if (pixels[y][x]) {
              bitmap[y * widthBytes + (x >> 3)] |= 1 << (7 - (x & 7));
            }
          }
        }

        var header = new Uint8Array([
          0x1d, 0x76, 0x30, 0x00,
          widthBytes & 0xff, (widthBytes >> 8) & 0xff,
          height & 0xff, (height >> 8) & 0xff
        ]);

        var init = new Uint8Array([0x1b, 0x40]);
        var feed = new Uint8Array([0x1b, 0x64, 0x0a]);
        var lf = new Uint8Array([0x0a, 0x0a, 0x0a, 0x0a, 0x0a]);

        var total = init.length + header.length + bitmap.length + feed.length + lf.length;
        var job = new Uint8Array(total);
        var pos = 0;
        job.set(init, pos); pos += init.length;
        job.set(header, pos); pos += header.length;
        job.set(bitmap, pos); pos += bitmap.length;
        job.set(feed, pos); pos += feed.length;
        job.set(lf, pos);

        addLog('Print job: ' + job.length + ' bytes (' + bitmap.length + ' bitmap)');

        await sendRaw(job);
        await sleep(2000);

        addLog('Печать завершена!', 'success');
        showToast('✅ Напечатано!', 'success');
      } catch (err) {
        addLog('Ошибка: ' + err.message, 'error');
        showToast('❌ ' + err.message, 'error');
      } finally {
        setTimeout(function() { btnPrint.disabled = false; }, 3000);
      }
    }

    function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    addLog('Приложение загружено (v3)');
    addLog('Web Bluetooth: ' + (navigator.bluetooth ? 'ДА' : 'НЕТ'));
    updatePreview();
    if (!navigator.bluetooth) {
      showToast('Web Bluetooth не поддерживается', 'error', 5000);
      btnScan.disabled = true;
    }
  </script>
</body>
</html>
