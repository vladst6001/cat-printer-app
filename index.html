<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cat Printer Test</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:20px}
    .app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;padding-top:20px}
    .header{text-align:center;font-size:14px;color:#888;text-transform:uppercase;letter-spacing:2px}
    .status-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#141414;border-radius:12px;border:1px solid #222}
    .status-dot{width:12px;height:12px;border-radius:50%;background:#ff3b30;flex-shrink:0;transition:background .3s}
    .status-dot.connected{background:#34c759;box-shadow:0 0 8px rgba(52,199,89,.5)}
    .status-text{font-size:15px;font-weight:500}
    .printer-name{margin-left:auto;font-size:13px;color:#666;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:#2563eb;color:#fff}
    .btn-print{background:#16a34a;color:#fff}
    .btn-disconnect{background:#991b1b;color:#fff;font-size:13px;padding:10px}
    .btn:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .section-label{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:1px}
    .input-group{display:flex;flex-direction:column;gap:6px}
    .input-group label{font-size:13px;color:#888}
    .input-group input,.input-group textarea{width:100%;padding:12px 14px;background:#141414;border:1px solid #333;border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none}
    .input-group input:focus,.input-group textarea:focus{border-color:#2563eb}
    .input-group textarea{min-height:50px;resize:vertical}
    .items-list{display:flex;flex-direction:column;gap:6px}
    .item-row{display:flex;gap:6px;align-items:center}
    .item-row input{padding:10px;background:#141414;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;outline:none}
    .item-row input[type="number"]{width:50px;text-align:center}
    .item-row input[type="text"]{flex:1}
    .item-remove{background:none;border:none;color:#666;font-size:18px;cursor:pointer;padding:4px}
    .item-remove:hover{color:#f87171}
    .add-item-btn{background:none;border:1px dashed #444;border-radius:8px;color:#666;padding:8px;cursor:pointer;font-size:14px;text-align:center}
    .add-item-btn:hover{border-color:#2563eb;color:#2563eb}
    .log-box{background:#111;border:1px solid #222;border-radius:8px;padding:10px;max-height:250px;overflow-y:auto;font-family:monospace;font-size:11px;color:#888;line-height:1.5}
    .log-entry{white-space:pre-wrap;word-break:break-all}
    .log-entry.error{color:#f87171}
    .log-entry.success{color:#4ade80}
    .log-entry.warn{color:#fbbf24}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);padding:14px 24px;border-radius:10px;font-size:15px;font-weight:500;z-index:1000;transition:transform .3s ease;max-width:90vw;text-align:center}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast-info{background:#1e40af;color:#fff}
    .toast-success{background:#166534;color:#fff}
    .toast-error{background:#991b1b;color:#fff}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">Cat Printer Test</div>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Не подключён</span>
      <span class="printer-name" id="printerName"></span>
    </div>
    <button class="btn btn-primary" id="btnScan" onclick="startScan()">Найти принтер</button>
    <button class="btn btn-disconnect" id="btnDisconnect" onclick="disconnectPrinter()" style="display:none">Отключиться</button>

    <div class="section-label">Настройка чека</div>
    <div class="input-group">
      <label>Название</label>
      <input type="text" id="shopName" value="ШАУРМА №1">
    </div>
    <div class="section-label">Позиции</div>
    <div class="items-list" id="itemsList">
      <div class="item-row">
        <input type="text" value="Шаурма классическая">
        <input type="number" value="1" min="1" max="99">
        <input type="number" value="8.50" min="0" step="0.01">
        <button class="item-remove" onclick="removeItem(this)">&times;</button>
      </div>
      <div class="item-row">
        <input type="text" value="Чипсы из лаваша">
        <input type="number" value="1" min="1" max="99">
        <input type="number" value="3.00" min="0" step="0.01">
        <button class="item-remove" onclick="removeItem(this)">&times;</button>
      </div>
    </div>
    <button class="add-item-btn" onclick="addItem()">+ Добавить</button>
    <div class="input-group">
      <label>Свой текст</label>
      <textarea id="customText" placeholder="Дополнительный текст..."></textarea>
    </div>

    <div class="section-label">Настройки печати</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="input-group" style="flex:1;min-width:100px">
        <label>Размер шрифта</label>
        <input type="range" id="fontSize" min="14" max="36" value="24" oninput="updPreview()">
        <span id="fontSizeVal" style="text-align:center;color:#888;font-size:13px">24px</span>
      </div>
      <div class="input-group" style="flex:1;min-width:100px">
        <label>Отступ снизу</label>
        <input type="range" id="feedLines" min="0" max="10" value="2" oninput="updPreview()">
        <span id="feedVal" style="text-align:center;color:#888;font-size:13px">2</span>
      </div>
      <div class="input-group" style="flex:1;min-width:100px">
        <label>Межстрочный</label>
        <input type="range" id="lineSpacing" min="0" max="10" value="2" oninput="updPreview()">
        <span id="lineSpaceVal" style="text-align:center;color:#888;font-size:13px">2</span>
      </div>
      <div class="input-group" style="flex:1;min-width:100px">
        <label>Позиции: отступ</label>
        <input type="range" id="itemSpacing" min="1" max="5" value="2" oninput="updPreview()">
        <span id="itemSpaceVal" style="text-align:center;color:#888;font-size:13px">2</span>
      </div>
    </div>

    <div class="section-label">Предпросмотр чека</div>
    <div style="background:#fff;border-radius:8px;padding:8px;overflow-x:auto;max-height:500px;overflow-y:auto">
      <canvas id="previewCanvas"></canvas>
    </div>

    <button class="btn btn-print" id="btnPrint" onclick="printReceipt()" disabled>Напечатать чек</button>

    <div class="section-label">Лог</div>
    <div class="log-box" id="logBox"></div>
  </div>
  <div class="toast toast-info" id="toast"></div>

  <script>
    var SVC='49535343-fe7d-4ae5-8fa9-9fafd205e455';
    var TX='49535343-8841-43f4-a8d4-ecbe34729bb3';
    var RX='49535343-1e4d-4bd9-ba61-23c647249616';
    var W=384;
    var CHUNK=100;
    var CHUNK_DELAY=20;
    var LINE_DELAY=8;
    var INIT_DELAY=150;
    var THRESHOLD=200;

    var device=null,txChar=null;
    var toastEl=document.getElementById('toast'),logBox=document.getElementById('logBox');

    function showToast(m,t,d){t=t||'info';d=d||3000;toastEl.textContent=m;toastEl.className='toast toast-'+t+' show';setTimeout(function(){toastEl.classList.remove('show')},d)}
    function log(m,c){var ts=new Date().toLocaleTimeString();var div=document.createElement('div');div.className='log-entry'+(c?' '+c:'');div.textContent='['+ts+'] '+m;logBox.appendChild(div);logBox.scrollTop=logBox.scrollHeight}
    function setStatus(ok,name){document.getElementById('statusDot').className=ok?'status-dot connected':'status-dot';document.getElementById('statusText').textContent=ok?'Подключён':'Не подключён';document.getElementById('printerName').textContent=name||'';document.getElementById('btnPrint').disabled=!ok;document.getElementById('btnDisconnect').style.display=ok?'block':'none'}
    function disconnectPrinter(){if(device&&device.gatt.connected)device.gatt.disconnect();device=null;txChar=null;setStatus(false);log('Отключено','error')}
    function addItem(){var l=document.getElementById('itemsList');var r=document.createElement('div');r.className='item-row';r.innerHTML='<input type="text" placeholder="Название"><input type="number" value="1" min="1"><input type="number" value="0.00" min="0" step="0.01"><button class="item-remove" onclick="removeItem(this)">&times;</button>';l.appendChild(r)}
    function removeItem(b){var l=document.getElementById('itemsList');if(l.children.length>1)b.parentElement.remove()}
    function getItems(){var items=[];document.querySelectorAll('#itemsList .item-row').forEach(function(r){var i=r.querySelectorAll('input');var n=i[0].value.trim(),q=parseInt(i[1].value)||1,p=parseFloat(i[2].value)||0;if(n)items.push({name:n,qty:q,price:p})});return items}
    function genText(){
      var shop=(document.getElementById('shopName').value||'МАГАЗИН').toUpperCase();
      var custom=document.getElementById('customText').value.trim();
      var items=getItems();
      var num=Math.floor(Math.random()*9000)+1000;
      var now=new Date(),ds=now.toLocaleDateString('ru-RU'),ts=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      var total=0;items.forEach(function(it){total+=it.qty*it.price});
      var itemSp=parseInt(document.getElementById('itemSpacing').value)||2;
      var sp='\n';
      for(var i=1;i<itemSp;i++)sp+='\n';
      var sep='================================';
      var t=sep+'\n\n  '+shop+'\n\n'+sep+'\n\n  ЗАКАЗ #'+num+'\n  '+ds+'  '+ts+'\n\n--------------------------------\n';
      items.forEach(function(it){
        t+=sp+'  '+it.name+'\n    '+it.qty+' x '+it.price.toFixed(2)+' = '+(it.qty*it.price).toFixed(2)+'\n';
      });
      t+='\n--------------------------------\n\n  ИТОГО:  '+total.toFixed(2)+' руб.\n\n'+sep+'\n';
      if(custom)t+='\n'+custom+'\n\n'+sep+'\n';
      t+='\n       Спасибо!\n';
      var feedN=parseInt(document.getElementById('feedLines').value)||0;
      for(var i=0;i<feedN;i++)t+='\n';
      return t;
    }

    function updPreview(){
      var fs=parseInt(document.getElementById('fontSize').value)||24;
      var ls=parseInt(document.getElementById('lineSpacing').value)||0;
      var fd=parseInt(document.getElementById('feedLines').value)||0;
      var is=parseInt(document.getElementById('itemSpacing').value)||2;

      document.getElementById('fontSizeVal').textContent=fs+'px';
      document.getElementById('feedVal').textContent=fd;
      document.getElementById('lineSpaceVal').textContent=ls;
      document.getElementById('itemSpaceVal').textContent=is;

      var text=genText();
      var lines=text.split('\n');
      var lh=Math.round(fs*1.25);
      var lhExtra=lh+ls;
      var totalH=lines.length*lhExtra+ls*fs;

      var cv=document.getElementById('previewCanvas');
      cv.width=W;cv.height=totalH;
      var cx=cv.getContext('2d');
      cx.fillStyle='#fff';cx.fillRect(0,0,W,totalH);
      cx.fillStyle='#000';
      cx.font=fs+'px monospace';
      cx.textBaseline='top';
      lines.forEach(function(l,i){cx.fillText(l,4,i*lhExtra+4)});
    }

    document.getElementById('shopName').addEventListener('input',updPreview);
    document.getElementById('customText').addEventListener('input',updPreview);
    document.getElementById('itemsList').addEventListener('input',updPreview);

    setTimeout(updPreview,100);

    function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

    async function startScan(){
      log('Сканирование...','success');
      document.getElementById('btnScan').disabled=true;
      document.getElementById('btnScan').innerHTML='<span class="spinner"></span> Поиск...';
      try{
        var d=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
        log('Найдено: '+d.name,'success');
        await doConnect(d);
      }catch(e){log('Ошибка: '+e.message,'error');showToast(e.message,'error')}
      finally{document.getElementById('btnScan').disabled=false;document.getElementById('btnScan').innerHTML='Найти принтер'}
    }

    async function doConnect(d){
      log('Подключение...');showToast('Подключение...','info');
      try{
        var gatt=await d.gatt.connect();log('GATT OK');
        var svc=await gatt.getPrimaryService(SVC);log('ISSC OK','success');
        txChar=await svc.getCharacteristic(TX);log('TX OK','success');
        try{var rx=await svc.getCharacteristic(RX);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',function(e){var v=new Uint8Array(e.target.value.buffer);log('RX: '+Array.from(v).map(function(b){return b.toString(16).padStart(2,'0')}).join(' '))});log('Notify OK','success')}catch(e){}
        d.addEventListener('gattserverdisconnected',function(){log('Отключено','error');device=null;txChar=null;setStatus(false)});
        device=d;setStatus(true,d.name);showToast('Подключён!','success');
      }catch(e){log('Ошибка: '+e.message,'error');showToast(e.message,'error');setStatus(false)}
    }

    async function sendChunked(data){
      for(var off=0;off<data.length;off+=CHUNK){
        var end=Math.min(off+CHUNK,data.length);
        await txChar.writeValueWithoutResponse(data.slice(off,end));
        if(off+CHUNK<data.length)await sleep(CHUNK_DELAY);
      }
    }

    async function printReceipt(){
      if(!device||!device.gatt.connected){showToast('Не подключён','error');return}
      log('=== ПЕЧАТЬ ===','success');
      document.getElementById('btnPrint').disabled=true;
      showToast('⏳ Печатается...','info',10000);
      try{
        var text=genText();
        log('Генерация canvas...');

        var fs=parseInt(document.getElementById('fontSize').value)||24;
        var ls=text.split('\n'),lh=Math.round(fs*1.25);
        var cv=document.createElement('canvas');cv.width=W;cv.height=ls.length*lh;
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,cv.height);
        cx.fillStyle='#000';cx.font=fs+'px monospace';cx.textBaseline='top';
        ls.forEach(function(l,i){cx.fillText(l,4,i*lh+4)});
        log('Шрифт: '+fs+'px, высота: '+cv.height+'px, строк: '+ls.length);

        log('Конвертация в bitmap...');
        var imgData=cx.getImageData(0,0,W,cv.height);
        var widthBytes=W/8;
        var totalLines=cv.height;
        log('Размер: '+W+'x'+totalLines+', '+widthBytes+' байт/строка');

        log('Init...');
        await sendChunked(new Uint8Array([0x1b,0x40]));
        await sleep(INIT_DELAY);

        log('Отправка '+totalLines+' строк bitmap...');
        for(var y=0;y<totalLines;y++){
          var line=new Uint8Array(widthBytes);
          for(var byteIdx=0;byteIdx<widthBytes;byteIdx++){
            var b=0;
            for(var bit=0;bit<8;bit++){
              var x=byteIdx*8+bit;
              if(x>=W)continue;
              var pIdx=(y*W+x)*4;
              var gray=imgData.data[pIdx]*0.299+imgData.data[pIdx+1]*0.587+imgData.data[pIdx+2]*0.114;
              if(gray<THRESHOLD)b|=0x80>>bit;
            }
            line[byteIdx]=b;
          }

          var header=new Uint8Array([0x1d,0x76,0x30,0x00,widthBytes&0xff,(widthBytes>>8)&0xff,0x01,0x00]);
          var pkt=new Uint8Array(header.length+line.length);
          pkt.set(header);pkt.set(line,header.length);
          await sendChunked(pkt);
          await sleep(LINE_DELAY);

          if(y%100===0)log('  '+y+'/'+totalLines);
        }

        log('Feed...');
        var feed=new Uint8Array(2);feed.fill(0x0a);
        await sendChunked(feed);

        await sleep(2000);
        log('Готово!','success');showToast('✅ Напечатано!','success');
      }catch(e){log('Ошибка: '+e.message,'error');showToast('❌ '+e.message,'error')}
      finally{setTimeout(function(){document.getElementById('btnPrint').disabled=false},3000)}
    }

    log('v8 загружено (userDKX protocol)');
    log('Web Bluetooth: '+(navigator.bluetooth?'ДА':'НЕТ'));
    if(!navigator.bluetooth){showToast('Web Bluetooth не поддерживается','error',5000);document.getElementById('btnScan').disabled=true}
  </script>
</body>
</html>
